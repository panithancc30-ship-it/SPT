<!doctype html>
<html lang="th" class="checking">
<head>
  <meta charset="utf-8">
  <title>SPT Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1D5C80">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #EDF1F0; --surface: #FFFFFF; --ink: #1B2427; --muted: #74838A; --line: #D4DDDC;
      --accent: #1D5C80; --accent-hover: #164A68; --accent-ink: #FFFFFF; --bad: #AE3A2D;
      --shadow: 0 1px 2px rgba(18, 34, 40, .05), 0 6px 20px rgba(18, 34, 40, .05);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111719; --surface: #182023; --ink: #E3EAEB; --muted: #84959A; --line: #2C383C;
        --accent: #6DB0D8; --accent-hover: #8AC2E3; --accent-ink: #0B1A22; --bad: #EE8A7D;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--ink);
      font: 15px/1.5 "IBM Plex Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
    }
    .checking body { visibility: hidden; }
    form {
      width: 100%; max-width: 340px; padding: 28px 24px 24px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .brand svg { width: 36px; height: 36px; flex: none; }
    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .01em; }
    .sub { margin: 0; color: var(--muted); font-size: 13px; }
    label.pw { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    input[type="password"] {
      display: block; width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--ink); font: inherit; font-size: 16px;
    }
    input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    .remember { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; color: var(--muted); font-size: 13px; cursor: pointer; }
    .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    button {
      width: 100%; min-height: 44px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: progress; }
    .msg { min-height: 20px; margin: 10px 0 0; color: var(--bad); font-size: 13px; text-align: center; }
    .hide { position: absolute; width: 1px; height: 1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>

  <script>
  (() => {
    // The app is AES-GCM encrypted with a key derived from the password (PBKDF2-SHA256); see tools/publish.mjs.
    const STORE = 'spt-lock-key';
    const P = JSON.parse(document.getElementById('payload').textContent);
    const $ = (id) => document.getElementById(id);
    const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const store = {
      get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
      set(v) { try { localStorage.setItem(STORE, v); } catch (e) { /* not remembered */ } },
      del() { try { localStorage.removeItem(STORE); } catch (e) { /* nothing stored */ } },
    };

    async function derive(pw) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iter },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }
    async function decrypt(key) {
      const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data));
      return new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }
    function launch(html) {
      document.open();
      document.write(html);
      document.close();
    }
    function ready() {
      document.documentElement.classList.remove('checking');
      $('pw').focus();
    }

    async function start() {
      if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
        ready();
        $('go').disabled = true;
        $('msg').textContent = 'เบราว์เซอร์นี้ไม่รองรับ กรุณาใช้ Chrome, Edge หรือ Safari รุ่นใหม่';
        return;
      }
      // ?lock forgets the key remembered on this device.
      if (/[?&]lock(=|&|$)/.test(location.search)) {
        store.del();
        history.replaceState(null, '', location.pathname + location.hash);
      }
      const saved = store.get();
      if (saved) {
        try {
          const key = await crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']);
          return launch(await decrypt(key));
        } catch (e) {
          store.del(); // password changed since it was remembered
        }
      }
      ready();
    }

    $('unlock').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = $('pw').value;
      if (!pw) return;
      $('go').disabled = true;
      $('go').textContent = 'กำลังเปิด…';
      $('msg').textContent = '';
      let key, html;
      try {
        key = await derive(pw);
        html = await decrypt(key);
      } catch (err) {
        $('go').disabled = false;
        $('go').textContent = 'เปิดแอป';
        $('msg').textContent = 'รหัสผ่านไม่ถูกต้อง';
        $('pw').select();
        return;
      }
      if ($('remember').checked) store.set(b64(await crypto.subtle.exportKey('raw', key)));
      launch(html);
    });

    start();
  })();
  </script>
